<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#57c9e0" />
    <title>Page Not Found | Pijon</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pijon-theme");
          var preferred = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          document.documentElement.dataset.theme = saved || preferred;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link href="./assets/fonts/poppins.css" rel="stylesheet" />
    <link href="./assets/remixicon/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./assets/feature-icon.svg" type="image/svg+xml" />
  </head>
  <body class="error-body">
    <div class="site-shell error-shell">
      <header class="site-header nav-collapsed" aria-label="Primary navigation">
        <a class="brand" href="./index.html#top" aria-label="Pijon home">pijon</a>
        <button
          class="nav-toggle"
          type="button"
          aria-controls="nav-tabs"
          aria-expanded="false"
          aria-label="Show navigation links"
        >
          <i class="nav-toggle-arrow ri-arrow-down-s-line" aria-hidden="true"></i>
          <i class="nav-toggle-menu ri-menu-3-line" aria-hidden="true"></i>
        </button>
        <nav class="nav-tabs" id="nav-tabs" aria-label="Sections">
          <a href="./index.html#features">Features</a>
          <a href="./premium.html">Pricing</a>
        </nav>
        <div class="header-actions">
          <a class="icon-button premium-trigger" href="./premium.html" aria-label="View premium features">
            <i class="ri-vip-crown-fill" aria-hidden="true"></i>
          </a>
          <a class="icon-button" href="./support.html" aria-label="Support">
            <i class="ri-lifebuoy-line" aria-hidden="true"></i>
          </a>
          <button class="icon-button theme-toggle" type="button" aria-label="Switch to dark mode">
            <i class="ri-moon-line" aria-hidden="true"></i>
          </button>
          <a class="icon-button" href="./index.html#contact" aria-label="Login">
            <i class="ri-login-box-fill" aria-hidden="true"></i>
          </a>
        </div>
      </header>

      <main class="error-page" id="top">
        <section class="error-copy" aria-labelledby="error-title">
          <p class="error-code">404</p>
          <h1 id="error-title">This trail went cold.</h1>
          <p>The page you were looking for has moved, changed, or never made it into evidence.</p>
          <a class="error-home" href="./index.html#top">
            <i class="ri-home-5-line" aria-hidden="true"></i>
            Return home
          </a>
        </section>
        <img
          class="error-mascot"
          src="./assets/mascot/mascot-side.png"
          width="512"
          height="625"
          alt="Pijon mascot"
        />
      </main>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
