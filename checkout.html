<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Complete your Pijon subscription." />
    <meta name="theme-color" content="#57c9e0" />
    <title>Pijon Checkout</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pijon-theme");
          var preferred = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          document.documentElement.dataset.theme = saved || preferred;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link href="./assets/fonts/poppins.css" rel="stylesheet" />
    <link href="./assets/remixicon/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./assets/feature-icon.svg" type="image/svg+xml" />
  </head>
  <body class="checkout-body">
    <div class="site-shell checkout-shell">
      <header class="site-header nav-collapsed" aria-label="Primary navigation">
        <a class="brand" href="./index.html#top" aria-label="Pijon home">pijon</a>
        <button
          class="nav-toggle"
          type="button"
          aria-controls="nav-tabs"
          aria-expanded="false"
          aria-label="Show navigation links"
        >
          <i class="nav-toggle-arrow ri-arrow-down-s-line" aria-hidden="true"></i>
          <i class="nav-toggle-menu ri-menu-3-line" aria-hidden="true"></i>
        </button>
        <nav class="nav-tabs" id="nav-tabs" aria-label="Sections">
          <a href="./index.html#features">Features</a>
          <a href="./premium.html">Pricing</a>
        </nav>
        <div class="header-actions">
          <a class="icon-button" href="./premium.html" aria-label="Back to premium">
            <i class="ri-arrow-left-line" aria-hidden="true"></i>
          </a>
          <a class="icon-button" href="./support.html" aria-label="Support">
            <i class="ri-lifebuoy-line" aria-hidden="true"></i>
          </a>
          <button class="icon-button theme-toggle" type="button" aria-label="Switch to dark mode">
            <i class="ri-moon-line" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <main class="checkout-page">
        <section class="checkout-summary" aria-labelledby="checkout-title">
          <span>Selected subscription</span>
          <h1 id="checkout-title" data-checkout-plan>Premium</h1>
          <div class="checkout-price">
            <strong data-checkout-price>€799</strong>
            <small data-checkout-interval>/ month</small>
          </div>
          <p data-checkout-capacity>Up to 250k monthly players</p>
          <a href="./premium.html">
            <i class="ri-arrow-left-line" aria-hidden="true"></i>
            Change plan
          </a>
        </section>

        <form class="checkout-form">
          <h2>Studio details</h2>
          <label>
            Studio name
            <input name="studio" autocomplete="organization" required />
          </label>
          <label>
            Work email
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <div class="checkout-fields">
            <label>
              Country
              <input name="country" autocomplete="country-name" required />
            </label>
            <label>
              VAT number
              <input name="vat" autocomplete="off" />
            </label>
          </div>
          <label class="checkout-consent">
            <input name="terms" type="checkbox" required />
            <span>
              I agree to the <a href="./terms-of-service.html">Terms</a> and
              <a href="./privacy-policy.html">Privacy Policy</a>.
            </span>
          </label>
          <button type="submit">
            Continue to secure payment
            <i class="ri-lock-line" aria-hidden="true"></i>
          </button>
          <p class="checkout-status" role="status" aria-live="polite"></p>
        </form>
      </main>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
