<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sign in to the Pijon studio dashboard." />
    <meta name="theme-color" content="#57c9e0" />
    <title>Sign in to Pijon</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pijon-theme");
          var preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = saved || preferred;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link href="./assets/fonts/poppins.css" rel="stylesheet" />
    <link href="./assets/remixicon/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=product-pass" />
    <link rel="icon" href="./assets/favicon/pijon-favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png" />
  </head>
  <body class="auth-body">
    <main class="auth-page">
      <a class="auth-brand" href="./index.html#top" aria-label="Pijon home">pijon</a>
      <section class="auth-card" aria-labelledby="sign-in-title">
        <div class="auth-mark"><i class="ri-shield-keyhole-line" aria-hidden="true"></i></div>
        <span>Secure studio access</span>
        <h1 id="sign-in-title">Sign in to Pijon</h1>
        <p>Access your studio dashboard, protected integration guides, evidence, and team settings.</p>
        <form class="login-form">
          <label>
            Work email
            <input name="email" type="email" autocomplete="email" placeholder="you@studio.com" required />
          </label>
          <button type="submit">Continue <i class="ri-arrow-right-line" aria-hidden="true"></i></button>
          <p class="login-status" role="status" aria-live="polite"></p>
        </form>
        <small>This is currently a product preview. New to Pijon? <a href="./premium.html">See plans and pricing</a>.</small>
      </section>
      <button class="auth-theme theme-toggle" type="button" aria-label="Switch to dark mode">
        <i class="ri-moon-line" aria-hidden="true"></i>
      </button>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
