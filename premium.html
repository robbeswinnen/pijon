<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Pijon premium anti-cheat features for competitive mobile game studios."
    />
    <meta name="theme-color" content="#57c9e0" />
    <title>Pijon Premium</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pijon-theme");
          var preferred = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          document.documentElement.dataset.theme = saved || preferred;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link href="./assets/fonts/poppins.css" rel="stylesheet" />
    <link href="./assets/remixicon/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./assets/feature-icon.svg" type="image/svg+xml" />
  </head>
  <body class="pricing-body">
    <div class="site-shell pricing-shell">
      <header class="site-header nav-collapsed" aria-label="Primary navigation">
        <a class="brand" href="./index.html#top" aria-label="Pijon home">pijon</a>
        <button
          class="nav-toggle"
          type="button"
          aria-controls="nav-tabs"
          aria-expanded="false"
          aria-label="Show navigation links"
        >
          <i class="nav-toggle-arrow ri-arrow-down-s-line" aria-hidden="true"></i>
          <i class="nav-toggle-menu ri-menu-3-line" aria-hidden="true"></i>
        </button>
        <nav class="nav-tabs" id="nav-tabs" aria-label="Sections">
          <a href="./index.html#platform">Platform</a>
          <a href="./index.html#studios">For Studios</a>
        </nav>
        <div class="header-actions">
          <a class="icon-button" href="./index.html#top" aria-label="Home">
            <i class="ri-home-5-line" aria-hidden="true"></i>
          </a>
          <a class="icon-button" href="./support.html" aria-label="Support">
            <i class="ri-lifebuoy-line" aria-hidden="true"></i>
          </a>
          <a class="icon-button" href="./index.html#contact" aria-label="Login">
            <i class="ri-login-box-fill" aria-hidden="true"></i>
          </a>
        </div>
      </header>

      <main class="pricing-page" id="top">
        <div class="hero-art premium-hero-art" aria-hidden="true">
          <span class="hero-shape hero-shape-top-glow"></span>
          <span class="hero-shape hero-shape-top-blue"></span>
          <span class="hero-shape hero-shape-main"></span>
          <span class="hero-shape hero-shape-bottom"></span>
        </div>

        <div class="pricing-layout">
          <section class="pricing-intro" aria-labelledby="pricing-title">
            <h1 id="pricing-title">More control. Deeper evidence. Premium protection.</h1>
            <div class="premium-switcher" role="tablist" aria-label="Premium views">
              <button
                type="button"
                role="tab"
                aria-controls="premium-plans"
                aria-selected="true"
                data-premium-view="plans"
              >
                <i class="ri-arrow-right-line" aria-hidden="true"></i>
                Plans
              </button>
              <button
                type="button"
                role="tab"
                aria-controls="premium-more"
                aria-selected="false"
                data-premium-view="more"
              >
                <i class="ri-add-line" aria-hidden="true"></i>
                More
              </button>
            </div>
          </section>

          <section class="pricing-panel" aria-label="Premium plans and features">
            <div
              class="premium-view is-active"
              id="premium-plans"
              role="tabpanel"
              data-premium-panel="plans"
            >
              <div class="pricing-panel-heading">
                <h2>Choose your plan.</h2>
                <i class="ri-vip-crown-fill" aria-hidden="true"></i>
              </div>

              <div class="premium-plan-grid">
                <article class="premium-plan">
                  <i class="ri-shield-check-line" aria-hidden="true"></i>
                  <h3>Core</h3>
                  <div class="premium-price"><span>€299</span><small>/ month</small></div>
                  <strong>Up to 50k players</strong>
                  <a href="./checkout.html?plan=core">
                    Buy Core
                    <i class="ri-arrow-right-line" aria-hidden="true"></i>
                  </a>
                </article>

                <article class="premium-plan premium-plan-featured">
                  <i class="ri-vip-crown-fill" aria-hidden="true"></i>
                  <h3>Premium</h3>
                  <div class="premium-price"><span>€799</span><small>/ month</small></div>
                  <strong>Up to 250k players</strong>
                  <a href="./checkout.html?plan=premium">
                    Buy Premium
                    <i class="ri-arrow-right-line" aria-hidden="true"></i>
                  </a>
                </article>

                <article class="premium-plan">
                  <i class="ri-building-2-line" aria-hidden="true"></i>
                  <h3>Scale</h3>
                  <div class="premium-price"><span>€149</span><small>/ 100k players</small></div>
                  <strong>Billed monthly</strong>
                  <a href="./checkout.html?plan=scale">
                    Buy Scale
                    <i class="ri-arrow-right-line" aria-hidden="true"></i>
                  </a>
                </article>
              </div>
            </div>

            <div
              class="premium-view"
              id="premium-more"
              role="tabpanel"
              data-premium-panel="more"
              hidden
            >
              <div class="pricing-panel-heading">
                <h2>Everything in Premium.</h2>
                <i class="ri-sparkling-2-line" aria-hidden="true"></i>
              </div>

              <div class="premium-feature-grid">
                <button class="premium-feature" type="button">
                  <i class="ri-links-line" aria-hidden="true"></i>
                  <span>Account Links</span>
                </button>
                <button class="premium-feature" type="button">
                  <i class="ri-equalizer-3-line" aria-hidden="true"></i>
                  <span>Studio Controls</span>
                </button>
                <button class="premium-feature" type="button">
                  <i class="ri-radar-line" aria-hidden="true"></i>
                  <span>Fair Play Intel</span>
                </button>
                <button class="premium-feature" type="button">
                  <i class="ri-customer-service-2-line" aria-hidden="true"></i>
                  <span>Priority Review</span>
                </button>
                <button class="premium-feature" type="button">
                  <i class="ri-shield-star-line" aria-hidden="true"></i>
                  <span>Advanced Policies</span>
                </button>
                <button class="premium-feature" type="button">
                  <i class="ri-bar-chart-grouped-line" aria-hidden="true"></i>
                  <span>Portfolio Insights</span>
                </button>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
